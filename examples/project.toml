# Copy to <project>/.maki/auto-approve.toml. Omitted settings inherit global values.
# Review and confirm this exact file with /auto-approve-trust before it is applied.
[reviewer]
# model = "provider/model-id"  # Otherwise inherit the active Maki model.
timeout_ms = 30000

[inspection]
max_file_bytes = 32768

# A project can disable automatic review entirely:
# Put enabled = false ABOVE all table headers.
#
# [policy]
# rubric = '''A complete replacement rubric for this project.'''
