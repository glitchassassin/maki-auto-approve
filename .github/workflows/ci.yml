name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 python3
      - name: Install pinned Maki
        env:
          MAKI_ARCHIVE: maki-v0.6.4-x86_64-unknown-linux-musl.tar.gz
          MAKI_SHA256: 1c02315bb5aa59f1fabbf15734e9a8c234e9ea6083f2788b769347f7bd94e87a
        run: |
          curl --fail --location --retry 3 "https://github.com/tontinton/maki/releases/download/v0.6.4/$MAKI_ARCHIVE" --output "$RUNNER_TEMP/$MAKI_ARCHIVE"
          echo "$MAKI_SHA256  $RUNNER_TEMP/$MAKI_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/maki-bin"
          tar -xzf "$RUNNER_TEMP/$MAKI_ARCHIVE" -C "$RUNNER_TEMP/maki-bin"
          echo "$RUNNER_TEMP/maki-bin" >> "$GITHUB_PATH"
      - name: Check syntax and configuration
        run: |
          maki --version
          find lua plugin tests examples -name '*.lua' -exec luac5.4 -p {} \;
          sh -n scripts/install-local.sh
          python3 -c 'import pathlib,tomllib; [tomllib.loads(p.read_text()) for p in pathlib.Path(".").rglob("*.toml")]'
          git diff --check
      - name: Unit tests
        run: lua5.4 tests/run.lua
      - name: Native Maki integration and terminal tests
        run: python3 tests/integration.py
